# Build the SvelteKit app (adapter-static) and deploy to GitHub Pages.
# See: https://docs.github.com/en/pages/getting-started-with-github-pages/configuring-a-publishing-source-for-your-github-pages-site#publishing-with-a-custom-github-actions-workflow
#
# One-time setup: In the repo, go to Settings → Pages → Build and deployment →
# Source: "GitHub Actions".

name: Deploy SvelteKit site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          # Optional: add cache: 'npm' and cache-dependency-path: web/package-lock.json
          # after committing web/package-lock.json for faster installs

      - name: Install dependencies
        working-directory: web
        run: npm install

      - name: Build
        working-directory: web
        env:
          BASE_PATH: '/${{ github.event.repository.name }}'
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/build

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
